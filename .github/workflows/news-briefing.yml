# ── Daily AI news briefing generator (FULL AUTO-PUBLISH) ─────────────────────
# Fires every day at 07:00 UTC. Generates a neutral, inline-cited 2-paragraph
# AI briefing with Claude, self-validates it (generate-briefing.mjs aborts on a
# malformed draft), then commits it straight to `main` — no PR, no manual review.
# Cloudflare Pages auto-deploys from main, so the briefing goes live on its own.
#
# Safety: the generator's validation guard (em-dash check, source/url alignment,
# length bounds) + the Zod schema at build time stop a broken briefing from
# publishing. A failed validation aborts the run and commits nothing.
#
# Required secrets (repo → Settings → Secrets → Actions):
#   ANTHROPIC_API_KEY  — Anthropic API key (console.anthropic.com). WITHOUT THIS
#                        the job fails immediately and no briefing is produced.
#
# The default GITHUB_TOKEN (contents: write, below) is what pushes to main.
# ────────────────────────────────────────────────────────────────────────────

name: Daily AI News Briefing

on:
  schedule:
    # 07:00 UTC daily
    - cron: '0 7 * * *'

  workflow_dispatch:
    inputs:
      date:
        description: 'Override date (YYYY-MM-DD, defaults to today UTC)'
        required: false
        type: string
      dry_run:
        description: 'Dry run — print draft but do not commit'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    name: Generate briefing + auto-publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Node ≥18
        run: |
          NODE_VER=$(node --version)
          MAJOR=$(echo "$NODE_VER" | sed 's/v\([0-9]*\).*/\1/')
          if [ "$MAJOR" -lt 18 ]; then
            echo "::error::Need Node 18+ (got $NODE_VER)"
            exit 1
          fi
          echo "Node: $NODE_VER ✓"

      - name: Generate briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_DATE: ${{ inputs.date || '' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/news/generate-briefing.mjs --dry-run 2>&1 | tee briefing-draft.txt
          else
            node scripts/news/generate-briefing.mjs 2>&1 | tee briefing-draft.txt
          fi

      - name: Check if file was created
        id: check
        run: |
          TODAY="${{ inputs.date || '' }}"
          if [ -z "$TODAY" ]; then
            TODAY=$(date -u +%Y-%m-%d)
          fi
          FILE="apps/web/src/content/news/${TODAY}.md"
          # A same-day file from a PREVIOUS commit also passes [ -f ] — only an
          # untracked/modified file counts as "created by this run", otherwise
          # the commit step stages nothing and fails red for no reason.
          if [ -n "$(git status --porcelain -- "$FILE")" ]; then
            echo "file_created=true" >> "$GITHUB_OUTPUT"
            echo "file_path=$FILE" >> "$GITHUB_OUTPUT"
            echo "date=$TODAY" >> "$GITHUB_OUTPUT"
            echo "✓ Created: $FILE"
          else
            echo "file_created=false" >> "$GITHUB_OUTPUT"
            echo "No new file to publish (dry run, thin news day, or already published)"
          fi

      - name: Commit + push briefing to main (auto-publish)
        # NB: inputs.dry_run is a real boolean — comparing against the STRING
        # 'true' never matches (GH casts mixed types via Number), so the old
        # guard could not block dry runs. Compare unquoted.
        if: steps.check.outputs.file_created == 'true' && inputs.dry_run != true
        run: |
          git config user.name "gekro-news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add "${{ steps.check.outputs.file_path }}"
          git commit -m "news(${{ steps.check.outputs.date }}): daily AI briefing [auto]"
          # Rebase onto any commits that landed since checkout, then push.
          # No "|| true" here: a swallowed rebase conflict used to leave the
          # repo mid-rebase and push a no-op — a GREEN run that silently lost
          # the briefing. Fail loudly instead (draft survives as the artifact).
          if ! git pull --rebase --autostash origin main; then
            git rebase --abort || true
            echo "::error::Rebase conflict while publishing the briefing — aborting. Draft is preserved in the run artifact."
            exit 1
          fi
          git push origin HEAD:main

      - name: Upload draft as artifact (debug)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: briefing-draft-${{ steps.check.outputs.date || 'unknown' }}
          path: briefing-draft.txt
          retention-days: 14
