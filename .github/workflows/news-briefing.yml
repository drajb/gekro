# ── Daily AI news briefing generator ────────────────────────────────────────
# Fires every day at 07:00 UTC (3am ET / midnight PT — feeds have updated
# from the prior day's output by this point). Generates a 1-2 paragraph
# AI industry briefing using Claude, opens a PR for Rohit to review.
#
# Feedback loop:
#   - PR description shows the full draft
#   - Rohit merges (approval) OR closes with a comment explaining what was
#     wrong (rejection). Either way the signal is captured.
#   - Once AUTO_MERGE_AFTER_N_APPROVALS consecutive approvals accumulate
#     without a rejection, the workflow switches to auto-merge.
#
# Required secrets (set in GitHub repo → Settings → Secrets → Actions):
#   ANTHROPIC_API_KEY  — Anthropic API key (console.anthropic.com)
#
# Optional secrets:
#   (none currently)
#
# The SUBMODULE_PAT secret (already configured for the CI pipeline)
# is reused here for the PR creation step.
# ────────────────────────────────────────────────────────────────────────────

name: Daily AI News Briefing

on:
  schedule:
    # 07:00 UTC daily
    - cron: '0 7 * * *'

  workflow_dispatch:
    inputs:
      date:
        description: 'Override date (YYYY-MM-DD, defaults to today UTC)'
        required: false
        type: string
      dry_run:
        description: 'Dry run — print draft but do not open PR'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate briefing + open PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify Node ≥18
        run: |
          NODE_VER=$(node --version)
          MAJOR=$(echo "$NODE_VER" | sed 's/v\([0-9]*\).*/\1/')
          if [ "$MAJOR" -lt 18 ]; then
            echo "::error::Need Node 18+ (got $NODE_VER)"
            exit 1
          fi
          echo "Node: $NODE_VER ✓"

      - name: Generate briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_DATE: ${{ inputs.date || '' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/news/generate-briefing.mjs --dry-run 2>&1 | tee briefing-draft.txt
          else
            node scripts/news/generate-briefing.mjs 2>&1 | tee briefing-draft.txt
          fi

      - name: Check if file was created
        id: check
        run: |
          TODAY="${{ inputs.date || '' }}"
          if [ -z "$TODAY" ]; then
            TODAY=$(date -u +%Y-%m-%d)
          fi
          FILE="apps/web/src/content/news/${TODAY}.md"
          if [ -f "$FILE" ]; then
            echo "file_created=true" >> "$GITHUB_OUTPUT"
            echo "file_path=$FILE" >> "$GITHUB_OUTPUT"
            echo "date=$TODAY" >> "$GITHUB_OUTPUT"
            echo "✓ Created: $FILE"
          else
            echo "file_created=false" >> "$GITHUB_OUTPUT"
            echo "No file created (dry run or already exists)"
          fi

      - name: Open pull request
        if: steps.check.outputs.file_created == 'true' && inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "news(${{ steps.check.outputs.date }}): daily AI briefing"
          branch: "news/briefing-${{ steps.check.outputs.date }}"
          delete-branch: true
          title: "📰 AI Briefing — ${{ steps.check.outputs.date }}"
          body: |
            ## Daily AI Briefing — ${{ steps.check.outputs.date }}

            Auto-generated by the news pipeline using Claude. Review the draft below.

            ### How to respond

            **To publish:** merge this PR. The briefing will go live at
            `gekro.com/news/${{ steps.check.outputs.date }}/` on the next deploy.

            **To reject:** close this PR with a comment explaining what was wrong
            (e.g. "too much OpenAI hype", "missed the paper on X", "tone too casual").
            The rejection reason feeds back into the curation prompt.

            ---

            ### Draft briefing

            ```
            $(cat briefing-draft.txt | tail -50)
            ```

            ---

            *Auto-generated by `.github/workflows/news-briefing.yml`*
          labels: |
            news
            automated

      - name: Upload draft as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: briefing-draft-${{ steps.check.outputs.date || 'unknown' }}
          path: briefing-draft.txt
          retention-days: 30
