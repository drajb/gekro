# ── Hyperscaler pricing weekly update (AUTO-PUBLISH) ───────────────────────
# Fires every Monday at 09:00 UTC. Runs the pricing fetchers, diffs the
# canonical hyperscaler-pricing.json, validates the result, and commits it
# straight to `main`. Manual trigger also exposed via workflow_dispatch.
#
# Why direct-commit instead of a PR: the PR flow looked safe but wasn't. Nobody
# merged PR #22 for 8 weeks, so the shipped data froze at 2026-06-01 while every
# Monday's run reported success — automation that "succeeds" while publishing
# nothing. See issue-tracker 2026-07-26.
#
# The review gate is replaced, not removed: scripts/pricing/validate-pricing.mjs
# refuses the commit on mass model/SKU loss, non-finite or negative prices,
# absurd magnitudes, or a >5x price jump. A failed validation leaves `main` on
# the last good data and turns the run RED.
#
# Setup checklist (one-time, in the GitHub repo settings):
#   1. Settings → Secrets and variables → Actions
#      → New repository secret: GCP_BILLING_API_KEY (see scripts/pricing/lib/fetch-gcp.mjs)
#   2. Settings → Actions → General → Workflow permissions
#      → "Read and write permissions"
#
# Without the secret: AWS + Azure fetchers run, GCP skips (logs a warning).
# ───────────────────────────────────────────────────────────────────────────

name: Update hyperscaler pricing

on:
  schedule:
    # Cron syntax: minute hour day-of-month month day-of-week
    # 0 9 * * 1  =  09:00 UTC every Monday
    # Why Monday morning? AWS/GCP/Azure pricing updates typically land late
    # Friday US-time; Monday morning UTC catches them with weekend buffer.
    - cron: '0 9 * * 1'

  # workflow_dispatch = a "Run workflow" button appears in the Actions tab.
  # Essential for testing without waiting for the cron, and for ad-hoc runs.
  workflow_dispatch:

# Permissions the GITHUB_TOKEN injected into this workflow needs.
# Default token is read-only; we need contents:write to push the commit.
# pull-requests:write is no longer required — this workflow opens no PRs.
permissions:
  contents: write

jobs:
  update:
    name: Fetch + validate + publish
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Get the repo onto the VM ────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7

      # ── Step 2: Verify the runner's pre-installed Node is usable ───────
      # No setup-node needed: ubuntu-latest ships with Node 20+ already
      # installed, which has native fetch (since 18) — the only dependency
      # our pricing scripts have. Skipping setup-node also avoids its
      # auto-detect cache machinery, which was throwing pnpm-related
      # warnings on every run because the repo root has a pnpm-lock.yaml
      # from the main Astro app even though the pricing scripts use no
      # packages at all. Belt-and-suspenders sanity check below.
      - name: Verify Node ≥18
        run: |
          NODE_VER=$(node --version)
          echo "Runner Node: $NODE_VER"
          MAJOR=$(echo "$NODE_VER" | sed 's/v\([0-9]*\).*/\1/')
          if [ "$MAJOR" -lt 18 ]; then
            echo "::error::Need Node 18+ (got $NODE_VER) for native fetch support"
            exit 1
          fi

      # ── Step 3: Run the orchestrator ────────────────────────────────────
      # Captures the script's stdout into a file we'll embed in the PR body
      # so the human reviewer sees the change summary inline.
      - name: Run pricing update
        env:
          # GitHub Actions injects this from the repo's Secrets store.
          # Empty string if the secret isn't set — the GCP fetcher handles
          # the missing-key case gracefully (logs a warning, returns []).
          GCP_BILLING_API_KEY: ${{ secrets.GCP_BILLING_API_KEY }}
        run: |
          node scripts/pricing/update-pricing.mjs 2>&1 | tee pricing-run.log
        # `2>&1` merges stderr into stdout, `tee` writes to file AND prints to
        # the workflow run log so you can see it in real time in the UI.

      # ── Step 4: Decide if the JSON changed in any meaningful way ────────
      # The script always writes the file (to update last_run timestamp).
      # We only want to open a PR if something substantive changed —
      # i.e. an actual price or last_verified bump, not just the timestamp.
      - name: Check for substantive changes
        id: check
        run: |
          # Get diff for the pricing file, ignore the last_run line itself.
          DIFF_LINES=$(git diff --no-color -- apps/web/src/content/data/hyperscaler-pricing.json \
            | grep -E '^[+-] ' \
            | grep -v '"last_run"' \
            | wc -l)

          echo "Diff lines (excluding last_run): $DIFF_LINES"
          echo "diff_lines=$DIFF_LINES" >> "$GITHUB_OUTPUT"

          if [ "$DIFF_LINES" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            # Revert the timestamp-only change so we don't dirty the working tree
            git checkout -- apps/web/src/content/data/hyperscaler-pricing.json
          fi

      # ── Step 5: Validate before publishing ──────────────────────────────
      # This used to open a PR for a human to review. Nobody did: PR #22 sat
      # unmerged for 8 weeks while the workflow reported success every Monday,
      # so the shipped data silently froze at 2026-06-01 (issue-tracker
      # 2026-07-26). The job now commits straight to main — which removes the
      # review gate, so this replaces it with an automated one.
      #
      # The validator diffs the new file against the committed version and fails
      # on anything that reads as a fetcher malfunction rather than a real price
      # move: mass model/SKU loss, non-finite or negative prices, absurd
      # magnitudes, or a >5x jump. On failure the step exits non-zero, nothing
      # is committed, and main keeps the last good data — stale-but-correct
      # beats confidently wrong.
      - name: Validate pricing data
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git show HEAD:apps/web/src/content/data/hyperscaler-pricing.json > /tmp/pricing-prev.json 2>/dev/null || true
          node scripts/pricing/validate-pricing.mjs \
            apps/web/src/content/data/hyperscaler-pricing.json \
            /tmp/pricing-prev.json

      # ── Step 6: Commit straight to main ─────────────────────────────────
      - name: Commit pricing update
        if: steps.check.outputs.has_changes == 'true'
        run: |
          set -o pipefail
          git config user.name "gekro-pricing-bot"
          git config user.email "pricing-bot@users.noreply.github.com"
          git add apps/web/src/content/data/hyperscaler-pricing.json
          git commit -m "chore(pricing): weekly hyperscaler pricing verification (${{ steps.check.outputs.diff_lines }} line(s))"
          # Rebase onto anything that landed since checkout, then push. No
          # "|| true": a swallowed conflict would leave the repo mid-rebase and
          # push a no-op — a GREEN run that silently drops the update, which is
          # the exact failure mode this change exists to eliminate.
          if ! git pull --rebase --autostash origin main; then
            git rebase --abort || true
            echo "::error::Rebase conflict while publishing pricing — aborting. Data preserved in the run artifact."
            exit 1
          fi
          git push origin HEAD:main

      # ── Step 6: Upload the run log as an artifact (always) ──────────────
      # Even if no PR is opened, the log is useful for debugging "why didn't
      # the fetcher find anything for model X?" — accessible from the run
      # page in the GitHub Actions UI for 90 days.
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pricing-run-log
          path: pricing-run.log
          retention-days: 90
