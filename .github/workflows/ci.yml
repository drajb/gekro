name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Checkout main repo (public — no token needed) ───────────
      - name: Checkout repository
        uses: actions/checkout@v5

      # ── Step 2: Initialise the private apps submodule ───────────────────
      # drajb/gekro-apps is private. We inject the PAT via git URL rewriting
      # so git can clone it during submodule init. Using a separate step (vs
      # submodules:recursive in checkout) gives clearer failure messages if
      # the PAT is wrong — the error names the failing repo explicitly.
      #
      # SUBMODULE_PAT requirements:
      #   Type:   GitHub Personal Access Token (NOT a deploy key / SSH key)
      #   Scope:  Classic PAT → repo:read   OR
      #           Fine-grained PAT → drajb/gekro-apps → Contents: Read-only
      #   Where:  drajb/gekro → Settings → Secrets → Actions → SUBMODULE_PAT
      - name: Initialise private apps submodule
        env:
          PAT: ${{ secrets.SUBMODULE_PAT }}
        run: |
          git config --global \
            url."https://${PAT}@github.com/drajb/gekro-apps".insteadOf \
            "https://github.com/drajb/gekro-apps"
          git submodule update --init --recursive

      # ── Step 3: Install pnpm (version from root package.json) ───────────
      # No 'version:' pin — pnpm/action-setup@v4 reads packageManager field
      # from package.json (currently pnpm@9.0.0). Pinning version:9 here
      # conflicts with the exact-version field and causes the step to fail.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # ── Step 4: Node + pnpm cache ────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'   # Node 22 LTS — Node 20 LTS exited maintenance Apr 2026
          cache: 'pnpm'

      # ── Step 5: Install deps ─────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Step 6: Type check ───────────────────────────────────────────────
      - name: Type check
        run: pnpm --filter web exec astro check

      # ── Step 7: Lint (non-blocking) ──────────────────────────────────────
      - name: Lint
        run: pnpm --filter web lint
        continue-on-error: true  # Don't block on lint until ESLint is fully configured

      # ── Step 8: Build ────────────────────────────────────────────────────
      - name: Build
        run: pnpm --filter web build
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ secrets.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ secrets.PUBLIC_SANITY_DATASET }}
