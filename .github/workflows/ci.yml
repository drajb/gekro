name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Checkout main repo ───────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6

      # ── Step 2: Clone private apps components ────────────────────────────
      # apps-private is NOT a git submodule — CF Pages v3 hard-codes
      # submodule auth before the build command, with no way to inject
      # credentials. Instead, we clone directly at build time.
      #
      # CF Pages build command (set in Settings → Build configuration):
      #   git clone https://x-access-token:${GITHUB_PAT}@github.com/drajb/gekro-apps.git \
      #     src/components/apps-private && pnpm build
      #
      # For CI we mirror that approach using SUBMODULE_PAT (same repo access):
      #   Classic PAT → repo:read  OR
      #   Fine-grained PAT → drajb/gekro-apps → Contents: Read-only
      #   Stored in: drajb/gekro → Settings → Secrets → Actions → SUBMODULE_PAT
      - name: Clone private apps components
        env:
          PAT: ${{ secrets.SUBMODULE_PAT }}
        run: |
          git clone \
            https://x-access-token:${PAT}@github.com/drajb/gekro-apps.git \
            apps/web/src/components/apps-private

      # ── Step 3: Install pnpm (version from root package.json) ───────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # ── Step 4: Node + pnpm cache ────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      # ── Step 5: Install deps ─────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Step 6: Type check (non-blocking) ────────────────────────────────
      # Deploy uses `astro build` (no typecheck), and this repo auto-publishes
      # news daily — content automation should not fail CI (or email) on code
      # type-checks. Same rationale as Lint below. Type errors still surface in
      # the step's annotations; they just don't fail the job. (2026-06-21)
      - name: Type check
        run: pnpm --filter web exec astro check
        continue-on-error: true

      # ── Step 7: Lint (non-blocking) ──────────────────────────────────────
      - name: Lint
        run: pnpm --filter web lint
        continue-on-error: true

      # ── Step 8: Unit + integrity tests (BLOCKING) ───────────────────────
      # Fast, deterministic, no browser. Guards the apps content<->map<->
      # component invariant (a drift silently ships a "coming soon" stub).
      # Safe to block: it only reads app files, so the daily news auto-commit
      # never trips it. Browser-level app smoke runs in e2e.yml.
      - name: Unit & integrity tests
        run: pnpm --filter web test

      # ── Step 9: Build ────────────────────────────────────────────────────
      - name: Build
        run: pnpm --filter web build
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ secrets.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ secrets.PUBLIC_SANITY_DATASET }}
