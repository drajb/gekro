# ── Local models weekly refresh ─────────────────────────────────────────────
# Fires every Monday at 09:30 UTC (30 min after the hyperscaler-pricing job so
# the two don't race for the merge queue). Re-fetches HuggingFace metadata +
# config.json for every model in apps/web/src/content/data/local-models.json
# that has an `hf_id`, refreshes architecture / license / context_window where
# the API contradicts the JSON, bumps `last_verified`, opens a PR if anything
# substantive changed.
#
# Setup checklist (one-time, in the GitHub repo settings):
#   1. (Optional but recommended) Settings → Secrets and variables → Actions
#      → New repository secret: HF_TOKEN — a HuggingFace personal access token
#        (read-only is fine). Without it the API works but has lower rate
#        limits, and gated models (some Llama variants) won't be readable.
#   2. Settings → Actions → General → Workflow permissions
#      → "Read and write permissions" + "Allow GitHub Actions to create pull
#        requests" (already set if the hyperscaler workflow runs)
#
# Manual trigger button is exposed via workflow_dispatch.
# ────────────────────────────────────────────────────────────────────────────

name: Update local models

on:
  schedule:
    # 09:30 UTC every Monday — 30 min after pricing-update.yml
    - cron: '30 9 * * 1'

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Refresh + diff + PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify Node ≥18
        run: |
          NODE_VER=$(node --version)
          echo "Runner Node: $NODE_VER"
          MAJOR=$(echo "$NODE_VER" | sed 's/v\([0-9]*\).*/\1/')
          if [ "$MAJOR" -lt 18 ]; then
            echo "::error::Need Node 18+ (got $NODE_VER) for native fetch"
            exit 1
          fi

      - name: Run local-models refresh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          node scripts/local-models/update-local-models.mjs 2>&1 | tee local-models-run.log

      - name: Check for substantive changes
        id: check
        run: |
          # Diff the JSON, ignoring last_updated + last_verified (those tick
          # every run even when no real field changed).
          DIFF_LINES=$(git diff --no-color -- apps/web/src/content/data/local-models.json \
            | grep -E '^[+-] ' \
            | grep -v '"last_updated"' \
            | grep -v '"last_verified"' \
            | wc -l)

          echo "Diff lines (excluding timestamp fields): $DIFF_LINES"
          echo "diff_lines=$DIFF_LINES" >> "$GITHUB_OUTPUT"

          if [ "$DIFF_LINES" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            # Revert the timestamp-only diff so the working tree stays clean
            git checkout -- apps/web/src/content/data/local-models.json
          fi

      - name: Open pull request
        if: steps.check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(local-models): weekly HuggingFace refresh'
          branch: local-models/auto-update
          delete-branch: true
          title: 'chore(local-models): weekly HuggingFace refresh'
          body: |
            ## Automated local-models verification

            Hit the HuggingFace API + raw config.json for every model with an
            `hf_id` in `local-models.json` and found
            ${{ steps.check.outputs.diff_lines }} line(s) of substantive
            changes (excluding `last_updated` / `last_verified` timestamps).

            ### What this captures

            - License renames (e.g. vendor relicenses Apache → custom)
            - Architecture detail corrections (layer count, hidden size, KV
              heads, head dim, intermediate size, MoE expert counts)
            - Context-window changes (model card updates)

            ### What this does NOT do

            - Add new models — that stays a manual-PR decision
            - Touch the `notes` field (editorial)
            - Touch `ollama_tag`, `type`, `supports` (curated)

            ### Review checklist

            - [ ] License changes look right vs the [HF model card](https://huggingface.co/)
            - [ ] Architecture deltas match the vendor's documentation
            - [ ] No models with valid HF IDs unexpectedly errored (see log)
            - [ ] Run `pnpm --filter web build` to confirm nothing broke

            Auto-generated by `.github/workflows/local-models-update.yml`.
          labels: |
            local-models
            automated

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: local-models-run-log
          path: local-models-run.log
          retention-days: 90
