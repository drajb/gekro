<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- gekro orbital brand mark. Mirrors the BrandLogo component: a glowing
       central star with a smaller planet dot on its orbital ring. Static
       here (favicons rasterise at small sizes where animation is invisible).
       Colour literals chosen because CSS vars do not apply to favicon SVGs:
       accent 3fb1ff, bg-surface 121214, border-subtle 27272a. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3fb1ff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#3fb1ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3fb1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="32" height="32" rx="8" fill="#121214"/>
  <circle cx="16" cy="16" r="11" stroke="#27272a" stroke-width="1" fill="none"/>
  <circle cx="16" cy="16" r="9" fill="url(#glow)"/>
  <circle cx="16" cy="16" r="4.5" fill="#3fb1ff"/>
  <circle cx="16" cy="5" r="2.5" fill="#3fb1ff"/>
</svg>
